[project]
name = "django-oauth-poc"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["django==6.0.6", "django-oauth-toolkit==3.4.1", "gunicorn>=23,<24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "poc_oauth"]

[tool.uv]
constraint-dependencies = ["oauthlib==3.3.1", "jwcrypto==1.5.7"]
