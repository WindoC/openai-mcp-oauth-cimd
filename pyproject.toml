[project]
name = "oauth-mcp-poc-integration"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "django-oauth-poc", "dot-fastmcp-calculator",
  "pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-django>=4.12,<5", "ruff>=0.12,<1",
]

[tool.uv.sources]
django-oauth-poc = { path = "django", editable = true }
dot-fastmcp-calculator = { path = "mcp", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
